services:
  ultra-mcp-ss:
    image: motebus/ultra-mcp-ss:latest
    restart:  unless-stopped
    container_name: ultra-mcp-ss
    hostname: ultra-mcp-ss
    env_file:
      - ultra-mcp-ss.env
      - ultra-mcp-ss-mchat.env
    environment:
      MCP_TRANSPORT: streamable-http+sse
      ULTRA_MCP_SS_MAP_TIER: dev
      ULTRA_MCP_SS_PATH: /mcp/ss
      ULTRA_MCP_SS_SSE_PATH: /sse/ss
      MCP_ALLOWED_HOSTS: localhost,localhost:*,127.0.0.1,127.0.0.1:*,[::1],[::1]:*,ultra-mcp-ss,ultra-mcp-ss:*,ultra-mcp.u22.ypcloud.com
      MCP_ALLOWED_ORIGINS: http://localhost:*,http://127.0.0.1:*,https://ultra-mcp.u22.ypcloud.com
    ports:
      - "8090:8000"
    networks:
      - ag-net

networks:
  ag-net:
    external: true

